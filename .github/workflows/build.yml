name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tip-tauri/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('tip-tauri/src-tauri/Cargo.lock') }}

      - name: Build
        working-directory: tip-tauri/src-tauri
        run: cargo build --release --locked

      # 文字非空 + 视觉居中回归(失败会让 CI 红)
      - name: Render self-test
        working-directory: tip-tauri/src-tauri
        run: cargo run --release --bin tip-selftest

      - name: Verify PE icon resources
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m pip install --quiet pefile
          python tools/check_pe_icon.py tip-tauri/src-tauri/target/release/tip-tauri.exe

      - name: Stage green build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item tip-tauri/src-tauri/target/release/tip-tauri.exe dist/ImTipLite.exe
          Copy-Item tip-tauri/src-tauri/target/release/WebView2Loader.dll dist/WebView2Loader.dll

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImTipLite-win-x64
          path: dist/*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ImTipLite.exe
            dist/WebView2Loader.dll
