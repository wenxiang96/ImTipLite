name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tip-tauri/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('tip-tauri/src-tauri/Cargo.lock') }}

      - name: Build
        working-directory: tip-tauri/src-tauri
        run: cargo build --release --locked

      # 文字非空 + 视觉居中回归(失败会让 CI 红)
      - name: Render self-test
        working-directory: tip-tauri/src-tauri
        run: cargo run --release --bin tip-selftest

      - name: Verify PE icon resources
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m pip install --quiet pefile
          python tools/check_pe_icon.py tip-tauri/src-tauri/target/release/tip-tauri.exe

      - name: Stage green build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item tip-tauri/src-tauri/target/release/tip-tauri.exe dist/ImTipLite.exe

          # GNU 工具链会把 WebView2Loader.dll 复制到 target/release/,
          # 而 MSVC 默认静态链接该加载器, 不会产生 DLL。两处都找一下。
          $candidates = @()
          $candidates += 'tip-tauri/src-tauri/target/release/WebView2Loader.dll'
          $candidates += Get-ChildItem -Path tip-tauri/src-tauri/target/release/build `
                          -Recurse -Filter WebView2Loader.dll -ErrorAction SilentlyContinue |
                        Where-Object { $_.FullName -match 'x64' } |
                        Select-Object -First 1 -ExpandProperty FullName
          $dll = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if ($dll) {
            Copy-Item $dll dist/WebView2Loader.dll
            Write-Output "staged WebView2Loader.dll <- $dll"
          } else {
            Write-Output "no WebView2Loader.dll (MSVC build links it statically)"
          }
          Get-ChildItem dist | Format-Table Name, Length | Out-String | Write-Output

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImTipLite-win-x64
          path: dist/*

      # Release 资产改为手动上传(tools/publish 流程):
      # CI 产物(MSVC 工具链)与本地发布产物(GNU 工具链 + WebView2Loader.dll)
      # 不同, 自动附加会互相覆盖。此处保留 artifact 供 CI 验证与排查用。
